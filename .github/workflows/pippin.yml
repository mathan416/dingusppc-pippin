# Project: DingusPPC-Pippin
# File: .github/workflows/pippin.yml
# Purpose: Build on 64-bit ARM Linux (where the JIT and fastmem run) and run the Pippin unit tests.
# Author: Iain Bennett
# Copyright (c) 2026 Iain Bennett
# SPDX-License-Identifier: GPL-3.0-or-later
# Change log:
#   2026-11-16 - Added: ARM64 build and CTest run for the pippin branch.
#   2026-11-16 - JIT self-tests via --jit-selftest with a zero-filled dummy ROM (no firmware needed).
#   2026-11-16 - actions/checkout v5 (Node 24).
# Full history: PIPPIN.md and Git history.
name: Pippin ARM64

on:
  push:
    branches: [ pippin ]
  pull_request:
    branches: [ pippin ]

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev ninja-build

    - name: Build
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDPPC_BUILD_PIPPIN_TESTS=ON
        cmake --build build

    - name: Unit tests
      run: ctest --test-dir build --output-on-failure --no-tests=error

    - name: JIT self-tests (no firmware needed)
      run: |
        truncate -s 4M zero.rom
        SDL_VIDEODRIVER=offscreen SDL_RENDER_DRIVER=software SDL_AUDIODRIVER=dummy \
          timeout 600 build/bin/dingusppc --jit-selftest -r -m pippin -b zero.rom --rambank3_size=8 \
          --log-to-stderr --log-verbosity=0 2>&1 | tee selftest.log
        grep -q "PIPPIN JIT SELFTEST PASS" selftest.log
